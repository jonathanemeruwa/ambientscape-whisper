<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambientscape Standalone Audio Transcription Engine</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #141312; color: #ffffff; padding: 15px; margin: 0; overflow: hidden; }
    .container { max-width: 600px; margin: 0 auto; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); box-sizing: border-box; }
    h2 { text-transform: uppercase; letter-spacing: 0.08em; font-size: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 8px; margin-top: 0; margin-bottom: 15px; text-align: center; }
    input[type="file"] { width: 100%; box-sizing: border-box; padding: 10px; background: #ffffff; color: #1a1a1a; border-radius: 4px; border: none; margin-bottom: 15px; font-size: 12px; }
    #transcribeBtn { background: #ffffff; color: #111111; border: none; padding: 12px; width: 100%; font-weight: 700; text-transform: uppercase; border-radius: 4px; cursor: pointer; font-size: 11px; transition: background 0.2s; margin-bottom: 10px; }
    #transcribeBtn:hover { background: #e1e0da; }
    #transcribeBtn:disabled { background: #444; color: #888; cursor: not-allowed; }
    .status { display: none; margin-top: 10px; padding: 10px; background: rgba(43, 114, 227, 0.1); border: 1px solid rgba(43, 114, 227, 0.3); border-radius: 4px; font-size: 12px; text-align: center; }
    .result-box { display: none; margin-top: 15px; background: #ffffff; color: #1a1a1a; padding: 15px; border-radius: 4px; box-sizing: border-box; }
    .result-content { font-size: 13px; line-height: 1.5; white-space: pre-wrap; font-family: monospace; background: #f7f5f0; padding: 10px; border-radius: 4px; max-height: 110px; overflow-y: auto; border: 1px solid #ddd; margin-bottom: 10px; }
    .button-group { display: flex; gap: 10px; justify-content: center; width: 100%; margin-top: 5px; }
  </style>
</head>
<body>
<div class="container">
  <h2>Sound Carrier Forensic Interpreter</h2>
  <input type="file" id="audioFile" accept="audio/*">
  <button id="transcribeBtn" onclick="executeChunkedAcousticAnalysis()">Extract Spoken Lyrics</button>
  <div id="statusIndicator" class="status">Streaming audio binary safely to your transcription cloud...</div>
  <div id="resultWrapper" class="result-box">
    <!-- SCRUBBED BRAND REFERENCE: REPLACED WITH ANONYMOUS SYSTEM BADGE -->
    <div style="font-size: 10px; text-transform: uppercase; font-weight: 700; color: #666; margin-bottom: 8px;">📝 Extracted Spoken Lyrics Output</div>
    <div id="textContent" class="result-content"></div>
  </div>
</div>
<script>
async function executeChunkedAcousticAnalysis() {
  const fileInput = document.getElementById("audioFile");
  const transcribeBtn = document.getElementById("transcribeBtn");
  const statusIndicator = document.getElementById("statusIndicator");
  const resultWrapper = document.getElementById("resultWrapper");
  const textContent = document.getElementById("textContent");
  
  if (!fileInput.files || fileInput.files.length === 0) { alert("Please select an audio file first."); return; }
  const targetTrackFile = fileInput.files;
  
  transcribeBtn.disabled = true;
  statusIndicator.style.display = "block";
  resultWrapper.style.display = "none";
  
  const CHUNK_SIZE = 1024 * 1024;
  const totalChunks = Math.ceil(targetTrackFile.size / CHUNK_SIZE);
  const uploadId = "upload_" + Date.now();
  const pythonEndpoint = "https://onrender.com";
  
  for (let currentChunk = 0; currentChunk < totalChunks; currentChunk++) {
    const start = currentChunk * CHUNK_SIZE;
    const end = Math.min(start + CHUNK_SIZE, targetTrackFile.size);
    const fileSlice = targetTrackFile.slice(start, end);
    
    statusIndicator.innerText = `Streaming audio block ${currentChunk + 1} of ${totalChunks}...`;
    
    const base64Data = await new Promise((resolve) => {
      const reader = new FileReader();
      reader.onloadend = () => {
        const resultString = reader.result;
        const commaIndex = resultString.indexOf(",");
        resolve(commaIndex !== -1 ? resultString.substring(commaIndex + 1) : resultString);
      };
      reader.readAsDataURL(fileSlice);
    });
    
    try {
      const response = await fetch(pythonEndpoint, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          fileData: base64Data,
          filename: targetTrackFile.name,
          uploadId: uploadId,
          isChunked: true,
          chunkIndex: currentChunk,
          totalChunks: totalChunks
        })
      });
      
      const data = await response.json();
      if (!data.success) { throw new Error(data.error || "Chunk assembly breakdown"); }
      
      if (currentChunk === totalChunks - 1) {
        statusIndicator.style.display = "none";
        transcribeBtn.disabled = false;
        textContent.innerText = data.transcribedText || "[No speech signatures detected]";
        resultWrapper.style.display = "block";
      }
    } catch (err) {
      statusIndicator.style.display = "none";
      transcribeBtn.disabled = false;
      alert("Transmission Pipeline Blocked: " + err.message);
      return;
    }
  }
}
</script>
</body>
</html>
